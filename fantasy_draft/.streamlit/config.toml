# "Broadcast" theme: NBA-on-TV graphics. Near-black studio backdrop, white type, live red as the one accent.
# Streamlit Cloud reads this file only at the top of the deployed branch (fantasy-draft-app is this folder).
# Fonts load from Google Fonts, one family per URL (Streamlit rejects more). Barlow Condensed loads from ui.py's CSS.
# Offline, the system sans-serif is used.

[theme]
base = "dark"
primaryColor = "#FF2D45"
backgroundColor = "#07090E"
secondaryBackgroundColor = "#141925"
textColor = "#F3F5F9"
borderColor = "#252C3B"
linkColor = "#FF6B7D"
baseRadius = "3px"
buttonRadius = "2px"
showWidgetBorder = true
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "'Big Shoulders Display':https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap, sans-serif"
dataframeHeaderBackgroundColor = "#0F131C"
dataframeBorderColor = "#1C2230"
greenColor = "#2EE58F"
redColor = "#FF5C74"
orangeColor = "#FFB020"

[theme.sidebar]
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#151A25"

[server]
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
